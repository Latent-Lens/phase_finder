name: Dependency and workflow security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - if: github.event_name == 'pull_request'
        working-directory: base
        run: |
          npm ci
          npm run build
      - if: github.event_name == 'pull_request'
        run: |
          DIST_DIR=base/dist npm run provenance
          npm run report:size -- base/dist/artifact-manifest.json dist/artifact-manifest.json
      - run: python -m pip install --requirement requirements-dev.txt pip-audit==2.9.0
      - run: python -m pip_audit --requirement requirements-dev.txt
      - run: python scripts/check_supply_chain.py
