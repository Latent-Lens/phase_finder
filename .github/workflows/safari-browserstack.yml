name: Native Safari compatibility

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  safari:
    name: Native Safari on BrowserStack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement tests/safari/requirements.txt
      - name: Test deployed production artifact in native Safari
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          PHASEFINDER_SAFARI_URL: ${{ vars.PHASEFINDER_SAFARI_URL }}
        run: python tests/safari/test_native_safari.py
      - name: Upload concise failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-safari-failure
          path: |
            safari-failure.png
            safari-failure.json
          if-no-files-found: ignore
          retention-days: 7
