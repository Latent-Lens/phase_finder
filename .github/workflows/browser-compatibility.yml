name: Browser compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engines:
    name: Linux / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m playwright install --with-deps "${{ matrix.browser }}"
      - run: python tests/e2e/driving_code/drive_flow.py --browser "${{ matrix.browser }}" --limited-media
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phasefinder-linux-${{ matrix.browser }}
          path: tests/e2e/results/
          if-no-files-found: warn
          retention-days: 14

  browser-channels:
    if: github.event_name != 'pull_request'
    name: ${{ matrix.os }} / ${{ matrix.browser }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: edge
          - os: ubuntu-latest
            browser: brave
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - shell: bash
        run: python -m pip install --requirement requirements-dev.txt
      - shell: bash
        run: python -m playwright install chromium
      - if: matrix.browser == 'edge'
        shell: bash
        run: python -m playwright install msedge
      - if: matrix.browser == 'brave'
        shell: bash
        run: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          sudo apt-get update
          sudo apt-get install -y brave-browser
          echo "BRAVE_PATH=/usr/bin/brave-browser" >> "$GITHUB_ENV"
      - shell: bash
        run: python tests/e2e/driving_code/drive_flow.py --browser "${{ matrix.browser }}" --limited-media
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phasefinder-${{ matrix.os }}-${{ matrix.browser }}
          path: tests/e2e/results/
          if-no-files-found: warn
          retention-days: 14
