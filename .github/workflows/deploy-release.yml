name: Deploy release to Cloudflare Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to preview release notes for
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phasefinder-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Resolve and validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          test -n "$RELEASE_TAG"
          git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Install browser test dependencies
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m playwright install --with-deps chromium
      - run: npm run check
      - name: Verify release provenance
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Smoke-test the production artifact
        run: python tests/e2e/driving_code/dist_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phasefinder-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Preview release notes
        if: github.event_name == 'workflow_dispatch'
        run: bash .github/scripts/update_release_notes.sh "$RELEASE_TAG" true

  release-notes:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash .github/scripts/update_release_notes.sh "$RELEASE_TAG" false

  deploy:
    # Containment switch: production remains fail-closed until the repository
    # owner explicitly enables the environment/repository variable.
    if: github.event_name == 'release' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: [build, release-notes]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: phasefinder-dist-${{ github.sha }}
          path: dist
      - name: Deploy reviewed artifact only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@3.114.15 pages deploy dist --project-name=phasefinder --branch=main
